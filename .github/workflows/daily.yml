name: Daily BTC sentiment run

on:
  schedule:
    - cron: "17 12 * * *"      # every day 12:17 UTC (6:17 AM US Central) — edit to taste
  workflow_dispatch: {}          # "Run workflow" button for manual refreshes

permissions:
  contents: write                # commit data/history.json back to the repo
  pages: write
  id-token: write

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}       # optional: AI brief + better sentiment
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}         # recommended: Reddit blocks anonymous cloud IPs
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}       # optional free demo key
        run: python -m agent.main

      - name: Save history to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: daily snapshot $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site_out
      - id: deploy
        uses: actions/deploy-pages@v4
